# Her push'ta derlenir. "v1.2.0" gibi bir etiket gönderilince exe derlenip GitHub Release olarak yayınlanır;
# Kahya'nın kendini güncelleme özelliği yeni sürümü buradan bulur.
#
# Sürüm çıkarmak:
#   1. Kahya.csproj içindeki <Version>'ı yükselt, Core/AppInfo.cs içindeki ReleaseNotes'a not ekle, commit'le.
#   2. git tag -a v1.2.0 -m "• yeni şey 1" -m "• yeni şey 2"     (etiket mesajı sürüm notu olur)
#   3. git push --follow-tags

name: Derleme

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # checkout etiketi açıklama mesajı olmadan indirir; sürüm notu (--notes-from-tag) için etiketin kendisi gerekir.
      - name: Etiketi indir
        if: startsWith(github.ref, 'refs/tags/v')
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derle
        run: dotnet build -c Release

      - name: Sürüm etiketle uyuşuyor mu?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Item bin/Release/net48/Kahya.exe).VersionInfo.ProductVersion.Split('+')[0]
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Kahya.csproj sürümü ($version) etiketle ($env:GITHUB_REF_NAME) uyuşmuyor. Önce <Version>'ı yükselt."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Kahya
          path: bin/Release/net48/Kahya.exe

      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin/Release/net48/Kahya.exe --title "Kahya $env:GITHUB_REF_NAME" --notes-from-tag
